name: uikit
description: "UIKit"
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.7
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.8.0
  vize: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/

  fonts:
    - family: Public Sans
      fonts:
        - asset: lib/fonts/PublicSans-Regular.ttf
          weight: 400
        - asset: lib/fonts/PublicSans-Medium.ttf
          weight: 500
        - asset: lib/fonts/PublicSans-SemiBold.ttf
          weight: 600
        - asset: lib/fonts/PublicSans-Bold.ttf
          weight: 700
        - asset: lib/fonts/PublicSans-ExtraBold.ttf
          weight: 800
    - family: Poppins
      fonts:
        - asset: lib/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: lib/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Roboto Flex
      fonts:
        - asset: lib/fonts/RobotoFlex-VariableFont_GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC,opsz,slnt,wdth,wght.ttf
          weight: 400